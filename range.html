<h1>Extract Range Format</h1>

<label>
  <textarea id="portList" rows="8" cols="50" placeholder="Paste your numbers here. Ranges can use a hyphen, an en dash or the word 'to' (033631000-033631009, 033631000 - 033631009), with or without spaces around the dash, and the shorthand 033631000-009 works too. Separate items with commas, spaces, tabs or new lines - trailing spaces and commas are fine. 033631000 is kept as is, 33631000 gets a leading zero, and 6433631000 is left in country-code format."></textarea>
</label>
<br>
<button onclick="formatPort()">Extract Numbers</button>

<div>
  <p id="counter"></p>
  <p id="notes"></p>
  <pre id="formattedPort"></pre>
</div>
